<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <title>THEOS LOGOS</title>
    
    <!-- PWA / iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="THEOS LOGOS" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fafaf9" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23821111'/%3E%3Cpath d='M128 160c0-26.5 21.5-48 48-48h80v288h-80c-26.5 0-48 21.5-48 48V160z' fill='%23ffffff'/%3E%3Cpath d='M384 160c0-26.5-21.5-48-48-48h-80v288h80c26.5 0 48 21.5 48 48V160z' fill='%23ffffff'/%3E%3Cpath d='M244 180h24v120h-24z' fill='%23821111'/%3E%3Cpath d='M214 210h84v24h-84z' fill='%23821111'/%3E%3C/svg%3E" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #fafaf9; /* stone-50 */
        color: #1c1917; /* stone-900 */
      }
      @media (prefers-color-scheme: dark) {
        body, html {
          background-color: #0c0a09; /* stone-950 */
          color: #fafaf9; /* stone-50 */
        }
      }
      /* Fallback handling for themes until React handles it */
      html.dark body, html.dark {
        background-color: #0c0a09 !important;
        color: #fafaf9 !important;
      }
      html.light body, html.light {
        background-color: #fafaf9 !important;
        color: #1c1917 !important;
      }
    </style>
  </head>
  <body>
    <script>
      (function() {
        var saved = localStorage.getItem('theos_logos_typography');
        var theme = 'auto';
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            theme = parsed.theme || 'auto';
          } catch(e) {}
        }
        if (theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
