  <head>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="THEOS LOGOS" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23821111'/%3E%3Cpath d='M128 160c0-26.5 21.5-48 48-48h80v288h-80c-26.5 0-48 21.5-48 48V160z' fill='%23ffffff'/%3E%3Cpath d='M384 160c0-26.5-21.5-48-48-48h-80v288h80c26.5 0 48 21.5 48 48V160z' fill='%23ffffff'/%3E%3Cpath d='M244 180h24v120h-24z' fill='%23821111'/%3E%3Cpath d='M214 210h84v24h-84z' fill='%23821111'/%3E%3C/svg%3E" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <script>
      // On-screen error reporter — makes crashes visible on devices without DevTools.
      (function () {
        function show(msg) {
          var el = document.getElementById("__errbox");
          if (!el) {
            el = document.createElement("div");
            el.id = "__errbox";
            el.style.cssText =
              "position:fixed;top:0;left:0;right:0;z-index:99999;background:#7f1d1d;color:#fff;" +
              "font:12px/1.5 monospace;padding:12px;white-space:pre-wrap;word-break:break-word;" +
              "max-height:60vh;overflow:auto;";
            (document.body || document.documentElement).appendChild(el);
          }
          el.textContent += msg + "\n\n";
        }
        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target !== window && (e.target.src || e.target.href)) {
              show("[Failed to load] " + (e.target.src || e.target.href));
              return;
            }
            show("[Error] " + (e.message || "unknown") + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"));
            if (e.error && e.error.stack) show(e.error.stack);
          },
          true
        );
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          show("[Promise] " + ((r && (r.stack || r.message)) || String(r)));
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && !root.firstChild) {
            show(
              "[Diagnostic] App did not start within 6 seconds and no JS error was caught. " +
                "The main script likely never loaded. Visit /api/debug for server info."
            );
          }
        }, 6000);
      })();
    </script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #fafaf9; /* stone-50 */
        color: #1c1917; /* stone-900 */
      }
      @media (prefers-color-scheme: dark) {
        body, html {
          background-color: #0c0a09; /* stone-950 */
          color: #fafaf9; /* stone-50 */
        }
      }
      /* Fallback handling for themes until React handles it */
      html.dark body, html.dark {
        background-color: #0c0a09 !important;
        color: #fafaf9 !important;
      }
      html.light body, html.light {
        background-color: #fafaf9 !important;
        color: #1c1917 !important;
      }
    </style>
  </head>
  <body>
    <script>
      (function() {
        var saved = localStorage.getItem('theos_logos_typography');
        var theme = 'auto';
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            theme = parsed.theme || 'auto';
          } catch(e) {}
        }
        if (theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
